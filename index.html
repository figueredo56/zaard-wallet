<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAARD WALLET - Protocolo Panga</title>
    <!-- Metadatos de Open Graph para compartir link -->
    <meta property="og:title" content="ZAARD WALLET">
    <meta property="og:description" content="La billetera oficial del ecosistema ZAARD Innovation y Protocolo Panga.">
    <meta property="og:image" content="https://figueredo56.github.io/zaard-official/assets/logo.png">
    <meta property="og:url" content="https://figueredo56.github.io/zaard-wallet/">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="zaard-audio" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-scifi.mp3" type="audio/mpeg">
    </audio>

    <div class="wallet-container">
        
        <!-- Cabecera e Idiomas -->
        <div class="header-top">
            <div class="wallet-title">
                <h1>ZAARD</h1>
                <h2>WALLET</h2>
                <p>Confianza de PANGA</p>
            </div>
            <div class="lang-container">
                <button class="lang-btn active" onclick="setLang('es')">ES</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
                <button class="lang-btn" onclick="setLang('ar')">AR</button>
                <button class="lang-btn" onclick="setLang('zh')">ZH</button>
            </div>
        </div>

        <!-- Botones de Conexión Web3 -->
        <div class="auth-box">
            <button id="connectBtn" class="btn-connect" onclick="connectWeb3()">Conectar Billetera (BSC)</button>
            <button id="disconnectBtn" class="btn-disconnect" onclick="disconnectWeb3()">Descartar</button>
        </div>

        <div class="section-title">Activos Principales</div>

        <!-- Balance BNB -->
        <div class="card-asset">
            <div class="asset-info">
                <h3>Balance BNB (BSC)</h3>
                <p id="bnb-balance">0.0000 BNB</p>
                <span class="asset-sub" id="bnb-usdt">≈ $0.00 USDT</span>
            </div>
        </div>

        <!-- Balance ZARD (Contrato: 0xb133...) -->
        <div class="card-asset">
            <div class="asset-info">
                <h3>ZARD (ZAARD Innovation)</h3>
                <p id="zard-balance">0.00 ZARD</p>
                <span class="asset-sub" id="zard-usdt">≈ $0.00 USDT</span>
            </div>
        </div>

        <!-- Enlace al Ecosistema -->
        <a href="https://figueredo56.github.io/index.html/?img=zaard" target="_blank" class="btn-ecosystem">Ir al Ecosistema ZAARD</a>

        <!-- Menú de Funciones -->
        <div class="nav-grid">
            <a href="https://figueredo56.github.io/zaard-official/" target="_blank" class="nav-item">
                🏠 <span>Inicio</span>
            </a>
            <button class="nav-item" onclick="openStakingModal()">
                💎 <span>Staking</span>
            </button>
            <button class="nav-item" onclick="openBrowserModal()">
                🌐 <span>Buscador</span>
            </button>
            <a href="https://pancakeswap.finance/swap?outputCurrency=0xb133033d44b61746c022fb25c070c5599e55181e" target="_blank" class="nav-item">
                🔄 <span>Swap</span>
            </a>
            <button class="nav-item" onclick="openSecurityModal()">
                🛡️ <span>Seguridad</span>
            </button>
            <a href="https://dexscreener.com" target="_blank" class="nav-item">
                📊 <span>Tracker</span>
            </a>
        </div>

        <!-- Reproductor de Audio -->
        <div class="audio-player">
            <div class="audio-controls">
                <button class="audio-btn" id="play-btn" onclick="togglePlay()">▶</button>
                <button class="audio-btn" onclick="stopAudio()">⏹</button>
            </div>
            <span id="audio-timer">0:00</span>
            <button class="audio-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
        </div>

    </div>

    <!-- Modales Informativos -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Aviso</h3>
            <p id="modal-text">Mensaje informativo.</p>
            <button class="modal-close" onclick="closeModal()">Aceptar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
